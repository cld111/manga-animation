[project]
name = "manga-animation"
version = "0.1.0"
description = "Turns a single manga page into a short, seamlessly looping animation using the minimum visually justified motion."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "manga-animation project" }]

# Heavy ML libraries remain optional because they are installed on the remote
# GPU worker. Classical CV is part of the normal development/runtime surface:
# the implemented analysis, animation and rendering modules import cv2.
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pillow>=10.3",
    "opencv-python-headless>=4.9",
    "huggingface-hub>=1.27.0",
    "pycocotools>=2.0.11",
]

[project.optional-dependencies]
# Kept as a named extra for compatibility with remote setup commands. The
# dependency is also in the base set because production modules import cv2.
cv = []

# Video assembly (FFmpeg wrapper). The `ffmpeg` binary itself is a
# system dependency and is not installed by pip.
video = ["ffmpeg-python>=0.2"]

# GPU/ML stack. Deliberately left unpinned on torch's CUDA build so it
# can be installed appropriately per-environment (local Apple MPS vs.
# Kaggle CUDA) instead of dragging a fixed wheel into the base project.
# Phase 3.1 selected one real candidate per model stage (see ADR 0005 and
# configs/default.yaml's model_variants) -- these four are that selection's actual
# runtime deps, not the full Phase 2 shortlist (owlv2/sam3/sdxl/etc. stay uninstalled).
ml = [
    "torch>=2.3",
    "transformers>=5.0",
    "accelerate>=0.30",     # required by device_map="auto" (Qwen2.5-VL sharding, ADR 0005)
    "simple-lama-inpainting>=0.1",
]

dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Repository = "local"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manga_animation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m \"not slow\""
markers = [
    "slow: opt-in wall-clock performance regression tests, excluded from the default run (see docs/phase7-results.md) -- run explicitly with `uv run pytest -m slow`.",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/manga_animation/animation_anything/vendored/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
exclude = [
    "^src/manga_animation/animation_anything/vendored/",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "websocket-client>=1.8",
]


