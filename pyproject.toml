[project]
name = "manga-animation"
version = "0.1.0"
description = "Turns a single manga page into a short, seamlessly looping animation using the minimum visually justified motion."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "manga-animation project" }]

# Phase 1 dependencies are intentionally minimal. Heavy ML libraries
# (torch, transformers, segment-anything, ultralytics, ...) are added
# in Phase 2 once models have been benchmarked and selected, and are
# kept in optional groups below so the base install stays lightweight
# and hardware-agnostic (CPU / Apple MPS / CUDA).
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pillow>=10.3",
]

[project.optional-dependencies]
# Classical CV, needed once segmentation/animation/compositing stages
# are implemented (Phase 2+). Not required for the Phase 1 foundation.
cv = ["opencv-python-headless>=4.9"]

# Video assembly (FFmpeg wrapper). The `ffmpeg` binary itself is a
# system dependency and is not installed by pip.
video = ["ffmpeg-python>=0.2"]

# GPU/ML stack. Deliberately left unpinned on torch's CUDA build so it
# can be installed appropriately per-environment (local Apple MPS vs.
# Kaggle CUDA) instead of dragging a fixed wheel into the base project.
ml = ["torch>=2.3"]

dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Repository = "local"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manga_animation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
