# Phase 9 Real-World Evaluation Dataset. See src/manga_animation/evaluation/dataset.py for the
# schema (EvalSample, reused as-is -- no parallel schema) and
# docs/decisions/0016-phase9-realworld-evaluation.md / docs/phase9-results.md for the dataset
# design and the real evaluation run this feeds.
#
# Why a separate file from configs/phase3_3_eval_dataset.yaml (the Phase 8 golden set): the
# Phase 9 brief is explicit that the existing 7-sample golden set is "primarily designed for
# regression/safety validation" and must not be treated as "a statistically meaningful
# real-world quality benchmark." This file is a second, larger, characterization-focused
# manifest -- loaded together with the golden set via
# `manga_animation.evaluation.load_combined_eval_dataset()` for Phase 9's own reporting, never
# merged into or duplicating the golden file itself.
#
# Every one of these 10 pages is a REAL manga/manhwa page (never synthetic/fabricated), from 8
# distinct MangaDex series, all different from the 3 series every earlier phase's dataset draws
# from ('The Skeleton Soldier Failed to Defend the Dungeon', 'Who Made Me a Princess', 'Latna
# Saga: Survival of a Sword King') -- see scripts/fetch_phase9_realworld_pages.py for exactly
# how each was chosen (MangaDex "Full Color" tag crossed with a genre-tag spread, then manual
# visual review of real candidate pages, same policy the two earlier fetch scripts already
# established).
#
# Ground truth provenance (see EvalSample's own module docstring and ADR 0009): every
# animation_possible/ground_truth_uncertain/tag value below was assigned by the Claude Code
# assistant performing DIRECT visual inspection of the actual downloaded source image against
# the `manga-analysis` skill's STATIC vs. ANIMATED checklist (motion lines, impact lines,
# wavy/flowing linework, deliberately-static backgrounds) -- never derived from running this
# project's own VLM/pipeline on the image (the exact anti-pattern ADR 0009 exists to prevent)
# and never guessed to fill a field. This is AI, not human, visual inspection -- distinct from
# `examples/verified_action/`'s `annotation_provenance: independent_human_verification` (the
# project owner's own direct confirmation) -- so `annotation_provenance` is deliberately left
# unset on every sample below (matching `eval_static_dialogue`/`phase3_action_page`'s own
# existing precedent of putting this reasoning in `notes` prose rather than claiming a
# provenance value this dataset doesn't actually have).
#
# Images are NOT committed (see .gitignore's `examples/**/*.png` rule -- copyrighted
# third-party content, re-fetchable on demand). Fetch them all before running the evaluation:
#   uv run python scripts/fetch_phase9_realworld_pages.py    -> examples/realworld/*.png
#
# Dataset composition (10 samples, computed for real via
# manga_animation.evaluation.dataset_composition -- see docs/phase9-results.md for the full
# table): 7 confident animation_possible="yes", 1 confident "no", 2 genuinely uncertain.
# Real, disclosed zero-coverage gaps in this file's own tags (not fabricated around): no sample
# is tagged `geometric_difficulty_tags: [near_boundary]` or `[partially_occluded]`, and no
# sample is tagged `motion_type_tags: [deformation]` or `potential_motion_tags:
# [facial_feature]`. `partially_occluded`/`deformation` mirror the golden set's own two
# disclosed gaps (`partially_occluded_object`/`scale_or_deformation` in
# configs/phase3_3_eval_dataset.yaml) -- occlusion and deformation remain a real, unclosed gap
# across the COMBINED dataset, not only this file. `near_boundary` is not chased here since the
# golden set's `verified_action_1` already covers it (incidentally); `facial_feature` was not
# found as a clear, real drawn motion cue (e.g. a blink/wink) on any candidate page reviewed
# during curation, so it was left uncovered rather than force-fit onto a page that doesn't
# actually show it.

samples:
  - sample_id: realworld_wind_breaker_sprint
    image_path: examples/realworld/wind_breaker_sprint.png
    source_citation: >
      'Wind Breaker', MangaDex chapter id 84a8bccc-591e-4de9-b764-2954fc5b5ad8 (ch. 540),
      page 9 of 32. See scripts/fetch_phase9_realworld_pages.py (hardcoded, reproducible on
      demand).
    diversity_tag: sports_action
    fetch_script: scripts/fetch_phase9_realworld_pages.py
    animation_possible: "yes"
    expected_target_category: null
    expected_motion_category: null
    expected_region_note: null
    acceptable_outcome: >
      A validated ACCEPT on a real cyclist/bicycle region (either a full rider or a specific
      part like the wheels) is a good outcome; an honest grounding/validation failure is also
      acceptable given several plausible targets exist and this dataset does not assert which
      single one is "the" correct choice. Not acceptable: an ACCEPT on the static narration
      caption or an unrelated background building.
    regression_reference: null
    ground_truth_uncertain: false
    notes: >
      Direct visual inspection: a 3-panel vertical strip of a road-cyclist race. Every panel
      has real drawn motion lines (near-horizontal streaks trailing the riders/background) and
      a blurred, speed-implying background -- a textbook ANIMATED read per the manga-analysis
      skill's "speed lines" cue, not a guess.
    annotation_version: 1
    scene_complexity_tags: [multiple_panels, complex_background]
    potential_motion_tags: [character_movement, object_moving_across_scene]
    geometric_difficulty_tags: [thin_structure]
    motion_type_tags: [translation]
    expected_difficulty: medium

