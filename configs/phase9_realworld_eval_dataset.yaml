  - sample_id: realworld_angels_of_war_fleet
    image_path: examples/realworld/angels_of_war_fleet.png
    source_citation: >
      'Tiejī Gāngbīng' ('Angels of War'), MangaDex chapter id
      3addf99c-2e3b-4754-addf-3aedae292c86 (ch. 1), page 11 of 24. See
      scripts/fetch_phase9_realworld_pages.py (hardcoded, reproducible on demand).
    diversity_tag: mecha_scifi
    fetch_script: scripts/fetch_phase9_realworld_pages.py
    animation_possible: uncertain
    expected_target_category: null
    expected_motion_category: null
    expected_region_note: null
    acceptable_outcome: >
      Either an honest all-STATIC analysis result OR a validated ACCEPT on the large central
      warship/mech (or one of the smaller fleet ships) are both acceptable outcomes for this
      specific page, given the genuinely ambiguous ground truth below. Not acceptable: an
      ACCEPT on the narration caption boxes.
    regression_reference: null
    ground_truth_uncertain: true
    notes: >
      Direct visual inspection: a wide sci-fi splash of a large mechanical warship over Earth
      surrounded by dozens of smaller fleet ships, with expository narration captions ("In the
      beginning of the 21st century..."). This is composed as an establishing/exposition
      illustration -- no drawn speed lines, no motion trail, no implied trajectory anywhere on
      the ship itself, which argues STATIC per the manga-analysis skill's checklist item 1
      ("what in the drawing itself justifies motion here?"). But the subject is a spacecraft in
      an interstellar setting, and the smaller ships' scattered, non-uniform orientations could
      also be read as a frozen mid-flight moment -- genuinely ambiguous by direct inspection,
      not confidently either way, so this is honestly marked uncertain rather than guessed.
      Included specifically for its real geometric difficulty (one large, structurally complex
      mechanical object with many holes/gaps and thin protruding parts against a busy
      multi-object background).
    annotation_version: 1
