# Phase 2 model candidate shortlist, consumed by src/manga_animation/benchmarking.
# See docs/decisions/0004-phase2-model-candidates.md for rationale, sources, and the
# benchmark methodology these candidates feed into. This file is data only — adding or
# removing a candidate is a config edit, not a code change.
#
# This is the research shortlist. `configs/default.yaml` contains the current preliminary
# runtime baseline; candidates without a production adapter must not be selected silently.

vlm:
  - id: qwen3-vl-8b-int8
    source: "Qwen/Qwen3-VL-8B-Instruct" # Hugging Face repo id (fp16); int8 pre-quantized at deploy
    license: qwen-license
    params: 8B (int8, ~9.5 GiB/card)
    notes: >
      Phase 22 runtime VLM. One bitsandbytes int8 instance per GPU (ADR 0023): each card
      runs its own copy, panels are split between them by a parallel description worker
      pool -- no device_map="auto" sharding, no cross-GPU token traffic. The weights are
      pre-quantized once to the bnb int8 layout before the run (fp16 materialization
      OOMs a single T4); loading the pre-quantized safetensors takes ~3 s.
  - id: qwen3-vl-8b
    source: "Qwen/Qwen3-VL-8B-Instruct" # Hugging Face repo id
    license: qwen-license
    params: 8B
    notes: >
      Phase 20 runtime VLM: fp16 sharded across 2xT4 via device_map="auto" (one model,
      two cards). Kept as the comparison baseline for the Phase 22 per-GPU int8 scheme.
  - id: qwen3-vl-4b
    source: "Qwen/Qwen3-VL-4B-Instruct" # Hugging Face repo id
    license: qwen-license
    params: 4B
    notes: >
      Phase 22 runtime VLM (default). fp16 (~8.5 GiB) fits a single T4, so it runs as ONE
      instance per GPU (device_map={"": "cuda:N"}, ADR 0023 per-GPU scheme): panels split
      between the cards by the description worker pool, no device_map="auto" sharding.
      Measured on wind_breaker_sprint: 601.6s panel mode (2xT4 pool), 3/4 PASS -- faster than
      Qwen3-VL-8B fp16 (1222s) and int8 (1818s). See docs/phase22-ab-test.md.
  - id: qwen2.5-vl-7b-instruct
    source: "Qwen/Qwen2.5-VL-7B-Instruct" # Hugging Face repo id
    license: qwen-license
    params: 7B
    notes: >
      Strong OCR (OCRBench ~888) — manga pages are text-dense. Fits comfortably on a
      T4/L4 at this size. Phase 20 replaces it as the runtime default, kept as a
      historical/benchmark candidate.
  - id: internvl3-8b
    source: "OpenGVLab/InternVL3-8B"
    license: MIT
    params: 8B
    notes: Least restrictive license in this list; check quality/license tradeoff vs Qwen.

grounding:
  - id: grounding-dino-swin-l
    source: "IDEA-Research/grounding-dino-base" # Swin-L backbone variant
    license: apache-2.0
    params: 218M
    notes: Best published zero-shot accuracy (COCO mAP 52.5); runs once per object, not per frame.
  - id: owlv2-vit-l14
    source: "google/owlv2-large-patch14-ensemble"
    license: apache-2.0
    params: 428M
    notes: ~2.7x faster than Grounding DINO; fallback if latency is a problem on Kaggle.
  - id: sam3-concept-grounding
    source: "facebookresearch/sam3"
    license: sam-license # verify commercial terms at integration time
    params: TBD
    notes: >
      Text/concept-promptable — may collapse the grounding and segmentation stages into
      one model. Architectural implication, not just a model swap; see ADR 0004.

segmentation:
  - id: sam2.1-hiera-base
    source: "facebook/sam2.1-hiera-base-plus"
    license: apache-2.0
    params: Hiera-B/L variants
    notes: Mature, well-documented, box/point-promptable. The safe default.
  - id: sam3
    source: "facebookresearch/sam3"
    license: sam-license
    params: TBD
    notes: >
      2x reported gain over SAM 2 on concept segmentation; some sources report much slower
      inference than lightweight detectors in certain configs — verify on our own workload,
      don't take an aggregator's number at face value.

inpainting:
  - id: lama-large
    source: "lama_large" # as used by manga-image-translator; exact checkpoint source TBD
    license: apache-2.0
    params: ~50M
    notes: Proven in production for manga text-region removal/fill. Fast, no prompting needed.
  - id: aot-inpainting-manga
    source: "mayocream/aot-inpainting" # Hugging Face
    license: TBD # community SafeTensors conversion — verify upstream license
    params: small
    notes: Manga-domain-tuned rather than generic-photo-tuned; direct prior art.
  - id: sdxl-inpainting
    source: "diffusers/stable-diffusion-xl-1.0-inpainting-0.1"
    license: TBD # CreativeML/SDXL license — verify commercial terms
    params: ~2.6B UNet
    notes: >
      Higher quality, prompt-guided style matching. Only worth the extra compute if
      LaMa/AOT visibly fail on complex screentone/texture regions.

animation:
  - id: animate-anything-512-v1.02
    source: "alibaba/animate-anything (v1.02 checkpoint from the project's aliyun OSS release)"
    license: apache-2.0 # vendored model code; see src/manga_animation/animation_anything/vendored/LICENSE
    params: ~1.7B UNet
    notes: >
      ADR 0024: the generative animation engine. Mask-conditioned video diffusion
      (Tune-A-Video architecture); input = original panel image + merged SAM motion mask +
      text prompt built from the accepted Qwen object descriptions. Requires an isolated
      worker environment with the upstream pinned stack (diffusers==0.24.0,
      transformers==4.36.2, torch==2.0.0) because it conflicts with this project's
      transformers>=5.0 `ml` extra. Native output 16 frames @ 8 fps (~2 s), which the
      pipeline renders as-is. The checkpoint (animate_anything_512_v1.02) is downloaded to
      the worker separately; the model source dir is passed by path, never committed.
