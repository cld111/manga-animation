# Phase 3.3 evaluation dataset manifest. See src/manga_animation/evaluation/dataset.py for the
# schema (EvalSample) and docs/phase3.3-results.md for the real evaluation run this feeds.
#
# Every sample is a REAL manga/webtoon page (never synthetic/fabricated). Ground truth fields
# are left null wherever this project does not actually have evidence for them -- per the
# Phase 3.3 brief: "Do NOT fabricate ground truth. ... If a sample has uncertain ground truth,
# explicitly mark it as uncertain instead of inventing a label."
#
# Images themselves are NOT committed (see .gitignore's examples/*.png rule -- copyrighted
# third-party content, re-fetchable on demand). Fetch them all before running the evaluation:
#   uv run python scripts/fetch_sample_pages.py          # (see note on sample_page_01/02 below)
#   uv run python scripts/fetch_phase3_sample_page.py     -> examples/phase3_action_page.png
#   uv run python scripts/fetch_phase3_3_eval_pages.py    -> the two eval_*.png pages
#
# NOTE on sample_page_01.png / sample_page_02.png: these two were originally fetched in Phase 2
# via fetch_sample_pages.py, which picks "the first full-color, English-translated manga by
# current follower count" -- a live, time-varying MangaDex query, NOT reproducible on demand
# the way the other three pages are (their citations are hardcoded chapter/page ids). Their
# exact series/chapter was not recorded in Phase 2's docs. This is a real, honest documentation
# gap carried forward from Phase 2, not fabricated now -- see each sample's `notes` below for
# what can still be said about them from direct visual inspection of the actual files already
# in this project's history.
#
# `annotation_version` (Phase 3.3.2, see docs/decisions/0009-evaluation-ground-truth-integrity.md):
# every sample below carries this field. It starts at 1 and is bumped by hand only when this
# file's ground-truth fields for that sample are intentionally revised -- an explicit, auditable
# marker on top of (not instead of) git's own history. `sample_page_02` is the one sample at
# version 2: its original `animation_possible: "yes"` (set from a single, later-contradicted VLM
# read) was revised to `"uncertain"` after two further independent real sessions read the same
# page as all-STATIC -- see that sample's `notes` for the full account. This file's own
# `EvalSample` Python type is frozen; this YAML is the only place ground truth may change.
#
# `golden_categories` (Phase 8, see docs/decisions/0014-phase8-e2e-validation.md): this same
# file doubles as Phase 8's golden E2E dataset -- reusing this real, already-evidenced dataset
# rather than fabricating a second, parallel one. Each sample's `golden_categories` lists which
# of the Phase 8 brief's 10 required coverage categories
# (manga_animation.evaluation.GOLDEN_DATASET_CATEGORIES) it demonstrates, based on real evidence
# already documented elsewhere in this project (cited per sample below) -- never a guess. Two
# categories have ZERO real coverage in this dataset, disclosed here rather than hidden:
# `partially_occluded_object` (no sample's documented evidence establishes occlusion) and
# `scale_or_deformation` (SCALE/MESH_WARP were only ever exercised via ad hoc, uncommitted Phase
# 7 driver scripts against sample_page_01.png's hair -- see docs/phase7-results.md section
# 6.5 -- never added as a real dataset sample). `object_near_boundary` has exactly one sample
# (verified_action_1), and only as an incidental by-product of a real geometry-validation
# rejection (a dropped candidate's own reported reason), not a sample deliberately chosen to
# exercise boundary proximity -- see that sample's own note below.
#
# `examples/verified_action/` (Pre-Phase-3.4, see ADR 0009's revision section): a small set of
# images the project owner manually placed and personally, independently confirmed contain real
# animation/action -- NOT derived from any VLM run, not even indirectly via a rendered output
# (the exact provenance gap `sample_page_02`'s original annotation had). These samples carry
# `fetch_script: null` (no field value, not merely empty) -- there is no script that can
# reproduce them; obtaining them means asking the project owner directly, an honestly-recorded
# permanent gap, not a temporary one like sample_page_01/02's live-query non-reproducibility.
# Independent verification establishes ONLY `animation_possible: "yes"` -- it does NOT establish
# which object is the target, which panel/region it's in, or which transform is appropriate, so
# `expected_target_category`/`expected_motion_category`/`expected_region_note` stay null on these
# samples, exactly like `phase3_action_page`'s already-established "yes, but target genuinely
# open" pattern -- not a new kind of gap, the same one this dataset already has real precedent
# for.

samples:
  - sample_id: sample_page_01
    image_path: examples/sample_page_01.png
    source_citation: >
      Fetched via scripts/fetch_sample_pages.py during Phase 2 (exact series/chapter not
      recorded at the time -- see the dataset-level note above). Visually: a dark-haired
      character against a starry sky says "WAIT A MINUTE." / "EXCUSE ME?", with a blue
      system-message-style UI box between panels.
    diversity_tag: ambiguous_nondeterministic
    fetch_script: scripts/fetch_sample_pages.py
    animation_possible: uncertain
    expected_target_category: null
    expected_motion_category: null
    expected_region_note: null
    acceptable_outcome: >
      Either an honest all-STATIC analysis result (stage=analysis, no video) OR a usable
      character_hair PRIMARY candidate that reaches a validated ACCEPT are both acceptable
      outcomes for this specific page, given real, already-documented run-to-run
      nondeterminism (docs/phase3.2-results.md's "Run 1" note: an earlier run produced a
      usable character_hair PRIMARY read on this same page; a later run came back all-STATIC).
      NOT acceptable: a validated ACCEPT on any object other than real hair-like content.
    regression_reference: null
    ground_truth_uncertain: true
    notes: >
      Real, evidenced VLM nondeterminism was specifically observed on this page
      (docs/phase3.2-results.md) -- this sample exists in the dataset specifically to measure
      that property (see the Phase 3.3 "VLM nondeterminism" repeated-run harness), not to
      assert a single correct answer.
    annotation_version: 1
    golden_categories: [single_animatable_object, translation]
    # single_animatable_object/translation: the one real candidate this page has ever produced
    # (Phase 3.2, ADR 0010's Phase 5 audit, section 6.4 above) is a single character_hair/
    # TRANSLATE target -- real IoU 0.974 segmentation, real LaMa reconstruction. NOT tagged
    # should_not_animate: ground_truth_uncertain=true means this is not a confident negative
    # control (contrast eval_static_dialogue below).

  - sample_id: sample_page_02
    image_path: examples/sample_page_02.png
    source_citation: >
      Fetched via scripts/fetch_sample_pages.py during Phase 2 (exact series/chapter not
      recorded at the time -- see the dataset-level note above). Visually: a phone-screenshot
      panel ("Three Ways To... [1st Revision]", "AT THAT TIME, WE SHOULDN'T HAVE"), held by a
      character's hand, credited "Flamecomics.com" at the bottom.
    diversity_tag: hair
    fetch_script: scripts/fetch_sample_pages.py
    animation_possible: uncertain
    expected_target_category: null
    expected_motion_category: null
    expected_region_note: null
    acceptable_outcome: >
      Either an honest all-STATIC analysis result (stage=analysis, no video) OR a completed
      render whose PRIMARY object is hair (validated ACCEPT, with unrelated page regions --
      face, both speech bubbles ("WAIT A MINUTE.", "EXCUSE ME?"), narration box -- staying
      pixel-identical outside the animated region) are both acceptable outcomes for this page,
      given the real, evidenced cross-session VLM nondeterminism described in `notes` below.
      NOT acceptable: a validated ACCEPT on any object other than real hair-like content.
    regression_reference: null
    ground_truth_uncertain: true
    notes: >
      Phase 3.3.2 revision (annotation_version 2, was 1; see
      docs/decisions/0009-evaluation-ground-truth-integrity.md): this sample's
      `animation_possible` was originally "yes" -- this dataset's one confident positive-control
      case -- on the strength of a single real Phase 3.2 session, in which the VLM read PRIMARY:
      character_hair and the resulting render was checked by direct, non-VLM pixel-diff of
      decoded frames (hair visibly translates between frame 0 and frame 24; the face, both
      speech bubbles, and the narration box stayed pixel-identical). That diff is real evidence
      that the *rendering* pipeline correctly isolated and animated the region the VLM had
      chosen -- it is not independent evidence that hair is *the* visually-justified animation
      target on this page, because no one separately re-examined the source artwork itself for
      a real drawn motion cue on the hair (contrast eval_static_dialogue's STATIC read, which
      does cite a direct check of the source page against this project's own STATIC/ANIMATED
      evidence categories). Two further real, independent sessions -- the main Phase 3.3 run
      (commit 7d05bd2) and the separate Phase 3.3.1 re-check -- had the same VLM read this same
      page as all-STATIC, in every call both times (docs/phase3.3-results.md's "VLM
      nondeterminism" section). Per ADR 0009's operational rule, this is not resolved by
      preferring whichever read looks more plausible, by majority vote, or by re-running the
      VLM until it agrees with the old label -- this sample's true ground truth requires human
      adjudication (ideally: independent visual inspection of examples/sample_page_02.png for a
      real drawn motion cue on the hair, the same evidentiary bar eval_static_dialogue's
      negative label already meets), which has not happened. Until it does, this sample is
      treated the same way sample_page_01 already is: genuinely uncertain, not a positive
      control -- not deleted, not silently relabeled "no".
    annotation_version: 2
    golden_categories: [single_animatable_object, translation]
    # Same real basis as sample_page_01: a single character_hair/TRANSLATE candidate is this
    # page's only documented real target (this sample's own notes above). Not should_not_animate
    # for the same reason -- ground_truth_uncertain=true, not a confident negative.

  - sample_id: phase3_action_page
    image_path: examples/phase3_action_page.png
    source_citation: >
      'The Skeleton Soldier Failed to Defend the Dungeon', MangaDex id
      d993f789-e7e5-4832-92fd-37614220b427, chapter 25 (id
      2cb6c639-033e-4064-a3fd-dacbe0aaaaad), page 13 of 15. See
      scripts/fetch_phase3_sample_page.py (hardcoded, reproducible on demand).
    diversity_tag: weapon_action_effects
    fetch_script: scripts/fetch_phase3_sample_page.py
    animation_possible: "yes"
    expected_target_category: null
    expected_motion_category: null
    expected_region_note: null
    acceptable_outcome: >
      Either a validated ACCEPT on a real weapon-shaped or cloth-banner-shaped region, OR an
      honest grounding/validation failure (no video), are both acceptable outcomes -- this
      page has multiple plausible real targets (a raised sword, vertical speed-line effects,
      hanging arena banners) and this dataset does not assert which single one is "the"
      correct choice. The ONE specifically unacceptable outcome is named under
      regression_reference below.
    regression_reference: >
      Phase 3.1's real automatic run grounded a "flag_banner" prompt to a face/speech-bubble
      region (score 0.269) and rendered a visibly distorted video (docs/phase3-results.md).
      Phase 3.2's validation stage was directly confirmed, on this exact page against real
      models, to REJECT that exact reproduction (docs/phase3.2-results.md's "Run 2":
      "The crop shows a character's head and dialogue box, not a flag banner."). A validated
      ACCEPT whose grounded crop is actually a face/dialogue-box region is the one outcome
      this sample must never reproduce again.
    ground_truth_uncertain: false
    honest_failure_acceptable: true
    notes: >
      Chosen originally (Phase 3.1) specifically for an unambiguous drawn motion cue; the
      exact best single target among several real candidates is genuinely open, which is why
      expected_target_category is left null rather than guessed.
    annotation_version: 2
    golden_categories:
      [multiple_animatable_objects, weapon_or_effect, rotation, translation, complex_background]
    # Real Phase 7 evidence (docs/phase7-results.md section 6.2): a real automatic panel-mode
    # run produced a fully rendered PRIMARY blood_splatter/TRANSLATE + SECONDARY character_hair/
    # MICRO output. Real ADR 0011 evidence separately grounds/validates/renders a PRIMARY
    # weapon/ROTATE target on this same page in a different session. complex_background: a dark
    # action panel with speed-line effects, per this sample's own diversity_tag/notes.
    # annotation_version bumped to 2 (Phase 8.3): honest_failure_acceptable=true formalizes
    # what acceptable_outcome above already said ("an honest grounding/validation failure...
    # are both acceptable outcomes") into a structured field -- classify_outcome previously
    # ignored this prose and classified a real attributed failure as ERROR on real Kaggle GPU
    # output (docs/phase8-results.md 6.2), contradicting this sample's own written contract.

  - sample_id: eval_static_dialogue
    image_path: examples/eval_static_dialogue.png
    source_citation: >
      'Who Made Me a Princess', MangaDex id 722a45c0-5e55-40f2-929b-ff69b0989edb, chapter 47
      (id 5607ccd4-5cc8-4a24-9053-7a0f22cffc46), page 4 of 17. See
      scripts/fetch_phase3_3_eval_pages.py (hardcoded, reproducible on demand).
    diversity_tag: static_dialogue
    fetch_script: scripts/fetch_phase3_3_eval_pages.py
    animation_possible: "no"
    expected_target_category: null
    expected_motion_category: null
    expected_region_note: null
    acceptable_outcome: >
      An honest all-STATIC analysis result (stage=analysis, no video produced) is the correct
      outcome. A completed render (any object animated) is a semantic false positive -- direct
      visual inspection finds no motion lines, no wind/implied-force cues on hair or clothing,
      and no mid-action pose anywhere on this page; every panel is characters talking.
    regression_reference: null
    ground_truth_uncertain: false
    notes: >
      Added specifically to give this dataset a confident (not merely nondeterministic-STATIC,
      like sample_page_01) real negative-control case, and to add a non-action genre/series to
      a dataset that was otherwise 100% one action-fantasy MangaDex series
      (docs/phase3.2-results.md's own flagged cross-series-generalization gap).
    annotation_version: 1
    golden_categories: [should_not_animate]
    # This dataset's one confident (ground_truth_uncertain=false) negative control -- the
    # cleanest real case for the Phase 8 brief's item 10 ("a case where an object should NOT be
    # animated").

  - sample_id: eval_weapon_effects
    image_path: examples/eval_weapon_effects.png
    source_citation: >
      'Latna Saga: Survival of a Sword King', MangaDex id
      478e6926-b8bc-465c-9694-2bae1dbaf32b, chapter 238 (id
      98b4f2e6-9703-494f-bd78-7d992aae48ca), page 26 of 83. See
      scripts/fetch_phase3_3_eval_pages.py (hardcoded, reproducible on demand).
    diversity_tag: weapon_action_effects
    fetch_script: scripts/fetch_phase3_3_eval_pages.py
    animation_possible: "yes"
    expected_target_category: null
    expected_motion_category: null
    expected_region_note: null
    acceptable_outcome: >
      A validated ACCEPT on a real weapon-shaped or energy-effect-shaped region is a good
      outcome; an honest grounding/validation failure (no video) is also acceptable, given
      this panel's motion cue is effect-heavy rather than one concrete, easily-prompted object.
      NOT acceptable: an ACCEPT whose grounded crop shows an unrelated background/dialogue
      region (the same class of failure this dataset's regression case, phase3_action_page,
      already guards against, now on a second, visually distinct series/art style).
    regression_reference: null
    ground_truth_uncertain: false
    honest_failure_acceptable: true
    notes: >
      A second, real, cross-series weapon/action/effects sample -- distinct series and art
      style from phase3_action_page, specifically to start giving the semantic-validation
      false-positive/false-negative measurement more than one series' worth of real evidence
      (docs/decisions/0006-grounding-target-validation.md's own flagged "untested on a second,
      visually distinct series" open question).
    annotation_version: 2
    golden_categories: [single_animatable_object, weapon_or_effect, rotation, complex_background]
    # Real evidence (docs/phase7-results.md section 8, ADR 0011): every real session's grounding
    # candidate for this page's one target (`weapon`) has been geometrically evaluated against
    # ROTATE's bound ("27.6% of its reference region, exceeding ROTATE's 15% cap") and rejected
    # -- a real, single-target, complex-background action panel, consistently REJECTED to date
    # (an acceptable outcome per this sample's own acceptable_outcome above, not a defect).
    # annotation_version bumped to 2 (Phase 8.3): honest_failure_acceptable=true formalizes what
    # acceptable_outcome above already said into a structured field -- classify_outcome
    # previously classified this sample's real, attributed, documented-acceptable validation
    # rejection as ERROR on real Kaggle GPU output (docs/phase8-results.md section 6.2 /
    # section 13's own disclosed "known issue"), contradicting this sample's own written
    # contract. This is the section-13 fix the Phase 8.3 brief asked for.

