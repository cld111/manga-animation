# Base configuration. Environment-specific files (local.yaml, kaggle.yaml) layer on top of
# this and only need to specify what differs. See src/manga_animation/core/config.py.

device: auto # resolved at runtime: cuda > mps > cpu
dtype: float32

# Phase 3.1 implementation defaults (see the Phase 3.1 brief and ADR 0005) — preliminary,
# single-candidate-per-stage selections from Phase 2's benchmarking, not a final
# cross-candidate comparison. Swappable: see "Model Abstraction" in docs/architecture.md.
model_variants:
  vlm: qwen2.5-vl-7b-instruct
  grounding: grounding-dino-swin-l
  segmentation: sam2.1-hiera-base
  inpainting: lama-large

resolution: 1536 # max working long-edge resolution, px
fps: 24
duration_s: 4.0 # ~3-5s seamless loop, per the project goal

batch_size: 1
num_workers: 0

output_codec: h264
debug: false
seed: 42

output_dir: outputs
