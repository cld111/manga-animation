# Remote profile for Kaggle/Jupyter GPU workers (T4, L4, ...). Kaggle is an ephemeral
# compute worker, not the canonical project copy — see docs/decisions/0003-remote-compute-workers.md.

device: cuda
dtype: float16 # VLM only; grounding/segmentation use float32 per verified runtime behavior
resolution: 2048 # VLM analysis resolution; grounding/segmentation use float32 explicitly
